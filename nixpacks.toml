[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_sqlite", "php82Extensions.mbstring", "php82Extensions.tokenizer", "php82Extensions.xml", "php82Extensions.ctype", "php82Extensions.fileinfo", "php82Extensions.dom", "php82Extensions.curl", "php82Extensions.zip", "composer"]

[phases.build]
cmds = ["touch /app/database/database.sqlite", "composer install --no-dev --optimize-autoloader"]

[phases.deploy]
cmds = ["touch /app/database/database.sqlite", "php artisan migrate --force"]

[start]
cmd = "php artisan serve --host 0.0.0.0 --port ${PORT:-8000}"
